name: Deploy sporadikspace

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "*/30 * * * *"

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}
      PUBLIC_DEFAULT_SUBSCRIBE_PROVIDER: buttondown
      PUBLIC_BUTTONDOWN_USERNAME: sporadik
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build site
        run: npm run build

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy

      - name: Verify live deployment
        run: |
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 https://sporadik.space/
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 https://sporadik.space/search-index.json
          curl --fail --silent --show-error --location --retry 5 --retry-delay 5 https://sporadik.space/rss.xml

      - name: Send latest journal entry to Buttondown
        if: ${{ env.BUTTONDOWN_API_KEY != '' }}
        env:
          GITHUB_EVENT_BEFORE: ${{ github.event.before }}
          GITHUB_SHA: ${{ github.sha }}
          SITE_URL: https://sporadik.space
        run: npm run publish:latest-email -- --changed-only
